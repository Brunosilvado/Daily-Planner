name: Build and deploy dashboard

on:
  workflow_dispatch:
    inputs:
      force_notify:
        description: "Send the push-notification digest right now, ignoring the usual ~6am-Central-only timing (for testing NTFY_TOPIC). Leave unchecked for a normal manual run."
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/**"
      - ".github/workflows/deploy.yml"
  schedule:
    # Minute 17 (not 0) for the afternoon/evening dashboard refreshes:
    # GitHub's own docs say scheduled workflows are most likely to be
    # delayed right at the top of the hour, when the most other repos'
    # cron jobs are also trying to fire. These two just keep the
    # dashboard's data fresh in the afternoon/evening — no notification
    # depends on hitting either one exactly.
    - cron: "17 20 * * *"
    - cron: "17 21 * * *"
    - cron: "17 1 * * *"
    - cron: "17 2 * * *"
    #
    # Morning cluster — nine candidates, 20 minutes apart, spanning
    # 10:07-12:47 UTC. That range covers roughly 5am-7:50am Central
    # under BOTH UTC-5 (CDT) and UTC-6 (CST), so no twice-yearly manual
    # DST edit is needed. This many candidates exist for ONE reason:
    # getting the daily push notification (see notify.py) close to 6am
    # actually requires it, because GitHub's free schedule trigger can
    # go quiet for hours (on 2026-10-12, nothing fired between 4:17am
    # and 9am Central with only two morning candidates) — having nine
    # chances instead of two makes it very likely at least one lands
    # close to on-time, and notify.py's own 5:50-Central floor (see its
    # comments) picks the first eligible one as that day's send, so
    # only one notification goes out even though many runs fire. Every
    # run still only takes ~20-30s and changes nothing else about cost
    # (GitHub Actions on a public repo is unmetered).
    - cron: "7 10 * * *"
    - cron: "27 10 * * *"
    - cron: "47 10 * * *"
    - cron: "7 11 * * *"
    - cron: "27 11 * * *"
    - cron: "47 11 * * *"
    - cron: "7 12 * * *"
    - cron: "27 12 * * *"
    - cron: "47 12 * * *"

permissions:
  # "write" (not just "read") lets notify.py commit ONE small, non-secret
  # marker file (.github/notify-state/last-sent.txt — just a date string
  # like "2026-10-11") via GitHub's Contents API, so it can tell "have we
  # already sent today's digest" even when several scheduled runs land
  # close together. This is GitHub's own short-lived per-run GITHUB_TOKEN
  # — not a new credential — and the marker file sits outside every path
  # this workflow's `push:` trigger watches (see that trigger's `paths:`
  # above), so this commit can never kick off an extra deploy run.
  #
  # (Earlier version used "actions: write" to read/write an Actions
  # repository VARIABLE instead — that never actually worked, because
  # GitHub blocks the default GITHUB_TOKEN from the Actions variables API
  # regardless of permissions. See notify.py's module docstring for the
  # full story.)
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Build dashboard + fresh data
        env:
          PAGES_SLUG: ${{ secrets.PAGES_SLUG }}
          YNAB_TOKEN: ${{ secrets.YNAB_TOKEN }}
          YNAB_BUDGET_ID: ${{ secrets.YNAB_BUDGET_ID }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GOOGLE_CALENDAR_IDS: ${{ secrets.GOOGLE_CALENDAR_IDS }}
          MS_GRAPH_CLIENT_ID: ${{ secrets.MS_GRAPH_CLIENT_ID }}
          MS_GRAPH_REFRESH_TOKEN: ${{ secrets.MS_GRAPH_REFRESH_TOKEN }}
          # Optional — see scripts/notify.py. Leaving this secret unset is
          # fully supported; the daily push-notification digest just
          # doesn't send, with no effect on the dashboard build itself.
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # Only set (to "true") when someone manually runs this workflow
          # with the "force_notify" checkbox ticked — see notify.py. Every
          # scheduled/push-triggered run leaves this unset, so the normal
          # once-a-day behavior is never affected.
          FORCE_NTFY_SEND: ${{ inputs.force_notify && 'true' || '' }}
          # Lets notify.py commit the notify-state marker file (see the
          # "contents: write" permission comment above). This is GitHub's
          # own short-lived per-run token, not a new secret — never
          # printed, never written to any file.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_site.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          # Security note: this build artifact (containing the real slug
          # AND the live personal data.json) is listed under this repo's
          # Actions tab and is downloadable by any signed-in GitHub user —
          # this repo being public means that's effectively "anyone with a
          # free account," not just people who already know the dashboard
          # URL. 1 day is GitHub's shortest allowed retention; it bounds
          # the exposure window but doesn't eliminate it, since a fresh
          # artifact replaces the old one on every run (6x/day). See the
          # "Security notes" section in README.md for the fuller picture
          # and the remaining mitigation that would close this properly.
          retention-days: 1

      - id: deployment
        uses: actions/deploy-pages@v4
