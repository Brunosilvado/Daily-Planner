name: Build and deploy dashboard

on:
  workflow_dispatch:
    inputs:
      force_notify:
        description: "Send the push-notification digest right now, ignoring the usual ~6am-Central-only timing (for testing NTFY_TOPIC). Leave unchecked for a normal manual run."
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/**"
      - ".github/workflows/deploy.yml"
  schedule:
    # Six runs/day, spanning both UTC-6 (CST) and UTC-5 (CDT) equivalents
    # of 6am / 3pm / 8pm Central, so the dashboard stays fresh without
    # needing a twice-yearly manual DST edit.
    #
    # Minute 17, not 0: GitHub's own docs say scheduled workflows are
    # most likely to be delayed right at the top of the hour, when the
    # most other repos' cron jobs are also trying to fire. Every run
    # that landed near 6am Central before this change was actually a
    # badly-delayed firing of one of these six slots — up to ~5 hours
    # late — because they were all queued at minute 0. This alone won't
    # guarantee on-time delivery (GitHub never promises exact timing for
    # the free schedule trigger), which is why notify.py also no longer
    # depends on hitting one exact hour — see its own comments.
    - cron: "17 11 * * *"
    - cron: "17 12 * * *"
    - cron: "17 20 * * *"
    - cron: "17 21 * * *"
    - cron: "17 1 * * *"
    - cron: "17 2 * * *"

permissions:
  contents: read
  pages: write
  id-token: write
  # Lets notify.py read/write ONE small, non-secret repository variable
  # (NOTIFY_LAST_SENT_DATE — just a date string like "2026-10-11") via
  # GitHub's API, so it can tell "have we already sent today's digest"
  # even when a scheduled run lands at an unpredictable time. This is
  # the GITHUB_TOKEN GitHub already mints fresh for every run and
  # revokes when the job ends — not a new credential — scoped to just
  # this repo's Actions variables, nothing else. See notify.py's own
  # comments for the full reasoning.
  actions: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Build dashboard + fresh data
        env:
          PAGES_SLUG: ${{ secrets.PAGES_SLUG }}
          YNAB_TOKEN: ${{ secrets.YNAB_TOKEN }}
          YNAB_BUDGET_ID: ${{ secrets.YNAB_BUDGET_ID }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GOOGLE_CALENDAR_IDS: ${{ secrets.GOOGLE_CALENDAR_IDS }}
          MS_GRAPH_CLIENT_ID: ${{ secrets.MS_GRAPH_CLIENT_ID }}
          MS_GRAPH_REFRESH_TOKEN: ${{ secrets.MS_GRAPH_REFRESH_TOKEN }}
          # Optional — see scripts/notify.py. Leaving this secret unset is
          # fully supported; the daily push-notification digest just
          # doesn't send, with no effect on the dashboard build itself.
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # Only set (to "true") when someone manually runs this workflow
          # with the "force_notify" checkbox ticked — see notify.py. Every
          # scheduled/push-triggered run leaves this unset, so the normal
          # once-a-day behavior is never affected.
          FORCE_NTFY_SEND: ${{ inputs.force_notify && 'true' || '' }}
          # Lets notify.py read/write the NOTIFY_LAST_SENT_DATE repository
          # variable (see the "actions: write" permission comment above).
          # This is GitHub's own short-lived per-run token, not a new
          # secret — never printed, never written to any file.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_site.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          # Security note: this build artifact (containing the real slug
          # AND the live personal data.json) is listed under this repo's
          # Actions tab and is downloadable by any signed-in GitHub user —
          # this repo being public means that's effectively "anyone with a
          # free account," not just people who already know the dashboard
          # URL. 1 day is GitHub's shortest allowed retention; it bounds
          # the exposure window but doesn't eliminate it, since a fresh
          # artifact replaces the old one on every run (6x/day). See the
          # "Security notes" section in README.md for the fuller picture
          # and the remaining mitigation that would close this properly.
          retention-days: 1

      - id: deployment
        uses: actions/deploy-pages@v4
