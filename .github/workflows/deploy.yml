name: Build and deploy dashboard

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/**"
      - ".github/workflows/deploy.yml"
  schedule:
    # Six runs/day, spanning both UTC-6 (CST) and UTC-5 (CDT) equivalents
    # of 6am / 3pm / 8pm Central, so the dashboard stays fresh without
    # needing a twice-yearly manual DST edit.
    - cron: "0 11 * * *"
    - cron: "0 12 * * *"
    - cron: "0 20 * * *"
    - cron: "0 21 * * *"
    - cron: "0 1 * * *"
    - cron: "0 2 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Build dashboard + fresh data
        env:
          PAGES_SLUG: ${{ secrets.PAGES_SLUG }}
          YNAB_TOKEN: ${{ secrets.YNAB_TOKEN }}
          YNAB_BUDGET_ID: ${{ secrets.YNAB_BUDGET_ID }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GOOGLE_CALENDAR_IDS: ${{ secrets.GOOGLE_CALENDAR_IDS }}
          MS_GRAPH_CLIENT_ID: ${{ secrets.MS_GRAPH_CLIENT_ID }}
          MS_GRAPH_REFRESH_TOKEN: ${{ secrets.MS_GRAPH_REFRESH_TOKEN }}
        run: python scripts/build_site.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          # Security note: this build artifact (containing the real slug
          # AND the live personal data.json) is listed under this repo's
          # Actions tab and is downloadable by any signed-in GitHub user —
          # this repo being public means that's effectively "anyone with a
          # free account," not just people who already know the dashboard
          # URL. 1 day is GitHub's shortest allowed retention; it bounds
          # the exposure window but doesn't eliminate it, since a fresh
          # artifact replaces the old one on every run (6x/day). See the
          # "Security notes" section in README.md for the fuller picture
          # and the remaining mitigation that would close this properly.
          retention-days: 1

      - id: deployment
        uses: actions/deploy-pages@v4
